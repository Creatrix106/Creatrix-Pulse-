# `docker compose up` starts the API only. The API stores everything in SQLite + parquet files under
# ./data (mounted below), which is what the application actually uses today.
#
# The PostgreSQL / Redis / worker services are scaffolding for a future migration and are NOT used
# by the API yet; they only start with:  docker compose --profile postgres up
services:
  api:
    build: .
    container_name: creatrix-pulse-api
    restart: always
    environment:
      # CHANGE THIS before deploying. Generate one with: python -c "import secrets; print(secrets.token_urlsafe(48))"
      - SECRET_KEY=${SECRET_KEY:-change-me-before-deploying}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      # Demo mode serves requests without a session as the demo admin. Set to false for production.
      - ALLOW_ANONYMOUS_DEMO=${ALLOW_ANONYMOUS_DEMO:-true}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    command: >
      sh -c "python -m app.db.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"

  db:
    profiles: ["postgres"]
    image: postgres:15-alpine
    container_name: creatrix-pulse-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: creatrix_pulse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./app/db/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d creatrix_pulse"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    profiles: ["postgres"]
    image: redis:7-alpine
    container_name: creatrix-pulse-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
